name: Desktop builds

# Builds the PhotoPane desktop app (Tauri) for Windows, macOS and Linux and attaches the installers
# to the workflow run as artifacts. Runs only on request: the "Run workflow" button in Actions
# or a version tag (v1.0.0 …), not on every push.
#
# macOS: the app is signed ad hoc (bundle.macOS.signingIdentity "-" in tauri.conf.json). Without any
# signature of the whole bundle, current macOS calls a downloaded app damaged and will not open it; signed
# ad hoc it asks once to allow it in System Settings > Privacy & Security > Open Anyway. Hardened runtime is
# off: it is only needed for notarization (a Developer ID certificate), which would turn it back on.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: PhotoPane-Windows
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            name: PhotoPane-macOS
            args: '--target universal-apple-darwin'
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # the oldest supported Ubuntu, so the packages run on older systems too
          - platform: ubuntu-22.04
            name: PhotoPane-Linux
            args: ''
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # what Tauri needs on Linux: the WebKitGTK web view, tray and SVG libraries, and tools for the AppImage
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      # the bundle must carry a valid signature as a whole, not only its executable (the linker's)
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Format|Signature|flags|Sealed'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
