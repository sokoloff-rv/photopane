<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
  </defs>
  <!-- the dark tile: 98 % of the icon, as large as its neighbours in the taskbar -->
  <rect x="10" y="10" width="1004" height="1004" rx="233" fill="url(#tile)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="231" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
  <!-- the mark from the menu bar: a large white square in front of an outlined one, with room around it -->
  <rect x="395.9" y="395.9" width="404.2" height="404.2" rx="90.2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="50.8"/>
  <rect x="198.5" y="198.5" width="451.2" height="451.2" rx="101.5" fill="#ffffff"/>
</svg>
