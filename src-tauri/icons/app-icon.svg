<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
  </defs>
  <!-- the dark tile: almost the whole icon, as large as its neighbours in the taskbar -->
  <rect x="24" y="24" width="976" height="976" rx="227" fill="url(#tile)"/>
  <rect x="26" y="26" width="972" height="972" rx="225" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
  <!-- the mark from the menu bar (a large white square in front of an outlined one), a fifth of the tile clear around it -->
  <rect x="403.4" y="403.4" width="378.0" height="378.0" rx="84.4" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="47.5"/>
  <rect x="218.9" y="218.9" width="421.9" height="421.9" rx="94.9" fill="#ffffff"/>
</svg>
