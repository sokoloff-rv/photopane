<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
  </defs>
  <!-- the dark tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
  <!-- the mark from the menu bar: a large white square in front of an outlined one -->
  <rect x="398" y="398" width="430" height="430" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="54"/>
  <rect x="188" y="188" width="480" height="480" rx="108" fill="#ffffff"/>
</svg>
